<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MT Voice</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 90%;
            max-width: 450px;
            background: #1b1b1b;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
        }

        input {
            background: #2a2a2a;
            color: white;
            outline: none;
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        #verifyBox {
            display: none;
        }

        #status {
            margin-top: 15px;
            line-height: 1.6;
        }

        #timer {
            margin-top: 10px;
            color: #aaa;
        }

        #code {
            text-align: center;
            direction: ltr;
            font-size: 22px;
            letter-spacing: 3px;
        }

        #voiceInfo {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #242424;
            font-size: 14px;
            line-height: 1.7;
        }

        .online {
            color: #4ade80;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>MT Voice</h1>

    <div id="usernameBox">

        <input
            id="username"
            type="text"
            placeholder="اكتب Roblox Username"
            autocomplete="off"
        >

        <button onclick="requestCode()">
            🔎 التحقق من الحساب
        </button>

    </div>

    <div id="verifyBox">

        <p>
            تم العثور على الحساب داخل الماب ✅
        </p>

        <p>
            اكتب رمز التحقق الظاهر لك داخل الماب
        </p>

        <input
            id="code"
            type="text"
            maxlength="8"
            placeholder="XXXXXXXX"
            autocomplete="off"
        >

        <button onclick="verifyCode()">
            🔐 تأكيد الرمز
        </button>

        <div id="timer">
            صلاحية الرمز: 10:00
        </div>

    </div>

    <button
        id="voiceButton"
        onclick="connectVoice()"
        style="display:none;"
    >
        🎙️ دخول الصوت
    </button>

    <button
        id="disconnectButton"
        onclick="disconnectVoice()"
        style="display:none;"
    >
        🔴 خروج من الصوت
    </button>

    <div id="voiceInfo">

        <div>
            📡 نظام الصوت:
            <span class="online">
                Proximity Voice
            </span>
        </div>

        <div>
            📏 مدى الصوت: 80 Stud
        </div>

        <div>
            🔊 الصوت ينخفض كلما ابتعدت
        </div>

    </div>

    <div id="status">
        غير متصل
    </div>

</div>

<script>

const API_URL = "https://mt-o8ez.onrender.com";

let room = null;
let verifiedUserId = null;
let timerInterval = null;
let positionInterval = null;

let secondsLeft = 600;

let maxVoiceDistance = 80;
let fullVolumeDistance = 5;

let ownPosition = null;

const remoteAudio = new Map();


/* =====================================================
   REQUEST CODE
===================================================== */

async function requestCode() {

    const username =
        document.getElementById("username").value.trim();

    const status =
        document.getElementById("status");

    if (!username) {

        status.textContent =
            "❌ اكتب Roblox Username أول";

        return;
    }

    try {

        status.textContent =
            "🔎 جاري التحقق من الحساب...";

        const response =
            await fetch(
                API_URL + "/auth/request",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username
                    })
                }
            );

        let data;

        try {
            data = await response.json();
        } catch (_) {

            throw new Error(
                "السيرفر أرسل استجابة غير صحيحة"
            );
        }

        if (!response.ok) {

            status.textContent =
                "❌ " +
                (
                    data.detail ||
                    "تعذر التحقق من الحساب"
                );

            return;
        }

        verifiedUserId =
            data.user_id;

        document.getElementById(
            "usernameBox"
        ).style.display = "none";

        document.getElementById(
            "verifyBox"
        ).style.display = "block";

        status.textContent =
            "🟡 تم العثور على حسابك، أدخل رمز التحقق";

        startTimer();

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حدث خطأ بالاتصال: " +
            error.message;
    }
}


/* =====================================================
   VERIFY CODE
===================================================== */

async function verifyCode() {

    const code =
        document.getElementById("code")
        .value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById("status");

    if (!verifiedUserId) {

        status.textContent =
            "❌ تحقق من الحساب أول";

        return;
    }

    if (!code) {

        status.textContent =
            "❌ اكتب رمز التحقق";

        return;
    }

    if (code.length !== 8) {

        status.textContent =
            "❌ الرمز يجب أن يكون 8 خانات";

        return;
    }

    try {

        status.textContent =
            "🔐 جاري التحقق من الرمز...";

        const response =
            await fetch(
                API_URL + "/auth/verify",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        user_id:
                            verifiedUserId,

                        code:
                            code
                    })
                }
            );

        let data;

        try {
            data = await response.json();
        } catch (_) {

            throw new Error(
                "السيرفر أرسل استجابة غير صحيحة"
            );
        }

        if (!response.ok) {

            status.textContent =
                "❌ " +
                (
                    data.detail ||
                    "رمز التحقق غير صحيح"
                );

            return;
        }

        clearInterval(timerInterval);

        document.getElementById(
            "verifyBox"
        ).style.display = "none";

        document.getElementById(
            "voiceButton"
        ).style.display = "block";

        status.textContent =
            "✅ تم التحقق من الحساب بنجاح";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حدث خطأ بالاتصال: " +
            error.message;
    }
}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(timerInterval);

    secondsLeft = 600;

    updateTimer();

    timerInterval =
        setInterval(() => {

            secondsLeft--;

            updateTimer();

            if (secondsLeft <= 0) {

                clearInterval(timerInterval);

                document.getElementById(
                    "verifyBox"
                ).style.display = "none";

                document.getElementById(
                    "usernameBox"
                ).style.display = "block";

                document.getElementById(
                    "status"
                ).textContent =
                    "⏰ انتهت صلاحية الرمز، اطلب رمزاً جديداً";
            }

        }, 1000);
}


function updateTimer() {

    const minutes =
        Math.floor(secondsLeft / 60);

    const seconds =
        secondsLeft % 60;

    document.getElementById(
        "timer"
    ).textContent =
        "صلاحية الرمز: " +
        minutes +
        ":" +
        String(seconds).padStart(2, "0");
}


/* =====================================================
   CONNECT VOICE
===================================================== */

async function connectVoice() {

    const status =
        document.getElementById("status");

    if (!verifiedUserId) {

        status.textContent =
            "❌ تحقق من حسابك أول";

        return;
    }

    try {

        status.textContent =
            "🎙️ جاري تشغيل المايك...";

        const response =
            await fetch(
                API_URL +
                "/voice/token?user_id=" +
                encodeURIComponent(
                    verifiedUserId
                )
            );

        let data;

        try {
            data = await response.json();
        } catch (_) {

            throw new Error(
                "تعذر قراءة استجابة الصوت"
            );
        }

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "فشل الحصول على توكن الصوت"
            );
        }

        maxVoiceDistance =
            Number(
                data.voice_max_distance || 80
            );

        fullVolumeDistance =
            Number(
                data.voice_full_volume_distance || 5
            );

        room =
            new LivekitClient.Room({
                adaptiveStream: true,
                dynacast: true
            });


        room.on(
            LivekitClient.RoomEvent.TrackSubscribed,
            (
                track,
                publication,
                participant
            ) => {

                if (
                    track.kind !== "audio"
                ) {
                    return;
                }

                const element =
                    track.attach();

                element.autoplay = true;
                element.playsInline = true;

                element.dataset
                    .participantIdentity =
                    participant.identity;

                document.body.appendChild(
                    element
                );

                if (
                    !remoteAudio.has(
                        participant.identity
                    )
                ) {

                    remoteAudio.set(
                        participant.identity,
                        new Set()
                    );
                }

                remoteAudio
                    .get(
                        participant.identity
                    )
                    .add(element);

                updateAllAudioVolumes();
            }
        );


        room.on(
            LivekitClient.RoomEvent.TrackUnsubscribed,
            (
                track,
                publication,
                participant
            ) => {

                const elements =
                    remoteAudio.get(
                        participant.identity
                    );

                if (elements) {

                    for (
                        const element
                        of elements
                    ) {

                        try {
                            element.remove();
                        } catch (_) {}
                    }

                    remoteAudio.delete(
                        participant.identity
                    );
                }

                try {
                    track.detach();
                } catch (_) {}
            }
        );


        await room.connect(
            data.url,
            data.token
        );


        await room.localParticipant
            .setMicrophoneEnabled(true);


        document.getElementById(
            "voiceButton"
        ).style.display = "none";

        document.getElementById(
            "disconnectButton"
        ).style.display = "block";

        document.getElementById(
            "voiceInfo"
        ).style.display = "block";

        status.textContent =
            "🟢 أنت الآن داخل الصوت";

        startPositionUpdates();

    } catch (error) {

        console.error(error);

        if (room) {

            try {
                await room.disconnect();
            } catch (_) {}

            room = null;
        }

        status.textContent =
            "❌ " + error.message;
    }
}


/* =====================================================
   POSITIONS
===================================================== */

async function updatePositions() {

    if (!verifiedUserId) {
        return;
    }

    try {

        const response =
            await fetch(
                API_URL + "/roblox/players",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            return;
        }

        const players =
            await response.json();

        ownPosition =
            players[
                String(verifiedUserId)
            ];

        if (!ownPosition) {

            updateAllAudioVolumes(
                players
            );

            return;
        }

        updateAllAudioVolumes(
            players
        );

    } catch (error) {

        console.error(
            "Position update error:",
            error
        );
    }
}


function startPositionUpdates() {

    stopPositionUpdates();

    updatePositions();

    positionInterval =
        setInterval(
            updatePositions,
            500
        );
}


function stopPositionUpdates() {

    if (positionInterval) {

        clearInterval(
            positionInterval
        );

        positionInterval = null;
    }
}


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(a, b) {

    if (!a || !b) {
        return Infinity;
    }

    const dx =
        Number(a.x) - Number(b.x);

    const dy =
        Number(a.y) - Number(b.y);

    const dz =
        Number(a.z) - Number(b.z);

    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );
}


/* =====================================================
   VOLUME
===================================================== */

function calculateVolume(distance) {

    if (!Number.isFinite(distance)) {
        return 0;
    }

    if (
        distance >=
        maxVoiceDistance
    ) {
        return 0;
    }

    if (
        distance <=
        fullVolumeDistance
    ) {
        return 1;
    }

    const range =
        maxVoiceDistance -
        fullVolumeDistance;

    const position =
        (
            distance -
            fullVolumeDistance
        ) / range;

    const volume =
        1 -
        Math.pow(
            position,
            1.35
        );

    return Math.max(
        0,
        Math.min(
            1,
            volume
        )
    );
}


/* =====================================================
   UPDATE AUDIO
===================================================== */

function updateAllAudioVolumes(
    players = null
) {

    if (!room) {
        return;
    }

    if (!players) {
        return;
    }

    for (
        const [
            identity,
            elements
        ]
        of remoteAudio
    ) {

        const userId =
            identity.startsWith("roblox_")
                ? identity.substring(7)
                : null;

        if (!userId) {

            for (
                const element
                of elements
            ) {
                element.volume = 0;
            }

            continue;
        }

        const remotePosition =
            players[userId];

        if (
            !remotePosition ||
            !ownPosition
        ) {

            for (
                const element
                of elements
            ) {
                element.volume = 0;
            }

            continue;
        }

        const distance =
            getDistance(
                ownPosition,
                remotePosition
            );

        const volume =
            calculateVolume(
                distance
            );

        for (
            const element
            of elements
        ) {

            element.volume =
                volume;
        }
    }
}


/* =====================================================
   DISCONNECT
===================================================== */

async function disconnectVoice() {

    stopPositionUpdates();

    if (room) {

        try {
            await room.disconnect();
        } catch (_) {}

        room = null;
    }

    for (
        const elements
        of remoteAudio.values()
    ) {

        for (
            const element
            of elements
        ) {

            try {
                element.remove();
            } catch (_) {}
        }
    }

    remoteAudio.clear();

    ownPosition = null;

    document.getElementById(
        "disconnectButton"
    ).style.display = "none";

    document.getElementById(
        "voiceButton"
    ).style.display = "block";

    document.getElementById(
        "voiceInfo"
    ).style.display = "none";

    document.getElementById(
        "status"
    ).textContent =
        "🔴 خرجت من الصوت";
}

</script>

</body>
</html>
